[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "blauberg-vento"
version     = "1.0.0"
description = "Python API for Blauberg Vento Expert Wi-Fi fans"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"
dependencies    = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
       "httpx>=0.27", "pytest-playwright>=0.5", "ruff>=0.6", "mypy>=1.10"]
gui = ["PySide6>=6.6", "netifaces>=0.11"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
ventocontrol = "ventocontrol.main:main"
ventosim     = "ventocontrol.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["blauberg_vento", "ventocontrol", "webdashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.coverage.run]
source = ["blauberg_vento"]

[tool.ruff]
line-length = 120
src = ["blauberg_vento", "ventocontrol", "webdashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
