[project]
name = "ha-blauberg-vento"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "ASYNC", "DTZ", "PL"]

[tool.pylint.MAIN]
py-version = "3.12"
ignore = ["tests"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "duplicate-code",
    "too-many-instance-attributes",
    "too-few-public-methods",
]
