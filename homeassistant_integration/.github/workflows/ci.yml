name: CI

on:
  push:
    branches: [main]
    paths: ["homeassistant_integration/**"]
  pull_request:
    paths: ["homeassistant_integration/**"]

defaults:
  run:
    working-directory: homeassistant_integration

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy homeassistant pylint
      - run: ruff check custom_components tests
      - run: mypy custom_components
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_test.txt homeassistant blauberg-vento
      - run: pytest --cov=custom_components --cov-report=term-missing
