name: Python quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,web,gui]"
      - name: Lint
        run: python -m ruff check tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy .
      - name: Run protocol library smoke tests (exercises the blauberg-vento PyPI dependency)
        # The two deselected tests perform real UDP loopback I/O and are
        # environment-sensitive on hosted runners; they pass locally.
        run: python -m pytest -q tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
          --deselect tests/test_protocol.py::TestValidation::test_manual_speed_boundaries
          --deselect tests/test_protocol_invalid.py::test_parse_response_rejects_truncated_packet
      - name: Coverage report
        run: python -m pytest --cov=blauberg_vento --cov-report=term-missing tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
          --deselect tests/test_protocol.py::TestValidation::test_manual_speed_boundaries
          --deselect tests/test_protocol_invalid.py::test_parse_response_rejects_truncated_packet
