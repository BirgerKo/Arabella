name: Python quality

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check blauberg_vento tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
      - name: Type check
        run: mypy blauberg_vento
      - name: Run library tests
        run: python -m pytest -q tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
