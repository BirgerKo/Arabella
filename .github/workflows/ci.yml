name: Python quality

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check blauberg_vento tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy blauberg_vento
      - name: Run library tests
        run: python -m pytest -q tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
      - name: Coverage report
        run: python -m pytest --cov=blauberg_vento --cov-report=term-missing tests/test_protocol.py tests/test_protocol_invalid.py tests/test_transport.py
